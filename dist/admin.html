<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Панель администратора — Заявки на вывод NFT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: { 800: '#1a1a2e', 900: '#0f0f23', card: '#16213e' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .badge-hold { background: #f59e0b; color: #fff; }
    .badge-sold { background: #22c55e; color: #fff; }
    .badge-available { background: #6b7280; color: #fff; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">🛡️ Панель администратора</h1>
        <p class="text-gray-400 text-sm mt-1">Заявки на вывод NFT</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="countBadge" class="bg-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full pulse">0</span>
        <button onclick="refreshRequests()" class="bg-dark-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-lg text-sm transition">🔄 Обновить</button>
      </div>
    </div>
    <div id="requestsContainer" class="space-y-4">
      <div class="text-center text-gray-500 py-12">
        <p class="text-4xl mb-4">⏳</p><p>Загрузка заявок...</p>
      </div>
    </div>
  </div>
  <div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-5 py-3 rounded-lg shadow-lg hidden transition-all z-50"></div>
  <script>
    const ADMIN_ID = "6267608438";

    function getAdminId() {
      var params = new URLSearchParams(window.location.search);
      return params.get("user_id") || ADMIN_ID;
    }

    function showToast(msg, type) {
      if (!type) type = "success";
      var toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "fixed bottom-6 right-6 px-5 py-3 rounded-lg shadow-lg z-50 transition-all " + (type === "success" ? "bg-green-600" : "bg-red-600") + " text-white";
      toast.classList.remove("hidden");
      setTimeout(function() { toast.classList.add("hidden"); }, 3000);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "\u2014";
      try {
        var d = new Date(dateStr);
        return d.toLocaleString("ru-RU", {
          day: "numeric", month: "short", year: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      } catch (e) { return dateStr; }
    }

    async function refreshRequests() {
      var container = document.getElementById("requestsContainer");
      var badge = document.getElementById("countBadge");
      container.innerHTML = '<div class="text-center text-gray-500 py-12"><p class="text-4xl mb-4">\u23F3</p><p>Loading...</p></div>';
      try {
        var adminId = getAdminId();
        var res = await fetch("/api/admin/requests?user_id=" + adminId);
        if (!res.ok) {
          if (res.status === 403) {
            container.innerHTML = '<div class="text-center text-red-400 py-12"><p class="text-4xl mb-4">\uD83D\uDEAB</p><p class="text-lg font-bold">Access Denied</p><p class="text-gray-500 mt-2">Check user_id parameter in URL</p></div>';
          } else {
            container.innerHTML = '<div class="text-center text-red-400 py-12"><p class="text-4xl mb-4">\u26A0\uFE0F</p><p>Error ' + res.status + '</p></div>';
          }
          return;
        }
        var items = await res.json();
        badge.textContent = items.length;
        if (items.length === 0) {
          container.innerHTML = '<div class="text-center text-gray-500 py-12"><p class="text-4xl mb-4">\u2705</p><p class="text-lg">No active requests</p><p class="text-gray-600 mt-2">All requests processed</p></div>';
          return;
        }

        var html = "";
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          var imgSrc = item.image || "/NO_Inventory.png";
          var price = item.floor ? Number(item.floor).toFixed(2) : "\u2014";
          html +=
            '<div class="bg-dark-800 rounded-xl p-4 card-hover transition-all border border-gray-800" data-id="' + item.id + '">' +
              '<div class="flex items-start gap-4">' +
                '<div class="flex-shrink-0">' +
                  '<img src="' + imgSrc + '" alt="' + item.name + '" class="w-20 h-20 rounded-lg object-contain bg-dark-900" onerror="this.src=\'/NO_Inventory.png\'">' +
                '</div>' +
                '<div class="flex-1 min-w-0">' +
                  '<div class="flex items-start justify-between gap-2">' +
                    '<div>' +
                      '<h3 class="font-bold text-base text-white truncate">' + item.name + '</h3>' +
                      '<p class="text-orange-400 font-semibold text-sm mt-0.5">\uD83D\uDCB0 ' + price + ' TON</p>' +
                    '</div>' +
                    '<span class="badge-hold text-xs font-bold px-2.5 py-1 rounded-full flex-shrink-0">\u23F3 Hold</span>' +
                  '</div>' +
                  '<div class="flex flex-wrap gap-3 mt-2 text-xs text-gray-400">' +
                    '<span>\uD83D\uDC64 ID: ' + item.user_id + '</span>' +
                    '<span>\uD83D\uDD14 Request: #' + item.id + '</span>' +
                    '<span>\uD83D\uDCC5 ' + formatDate(item.timestamp) + '</span>' +
                  '</div>' +
                  '<div class="flex gap-2 mt-3">' +
                    '<button onclick="handleAction(' + item.id + ', \'approve\')" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-sm font-bold py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5">\u2705 Issue</button>' +
                    '<button onclick="handleAction(' + item.id + ', \'reject\')" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-sm font-bold py-2 px-3 rounded-lg transition flex items-center justify-center gap-1.5">\u274C Reject</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>';
        }
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<div class="text-center text-red-400 py-12"><p class="text-4xl mb-4">\u274C</p><p>Connection error: ' + err.message + '</p></div>';
      }
    }

    async function handleAction(inventoryId, action) {
      var container = document.getElementById("requestsContainer");
      var card = container.querySelector('[data-id="' + inventoryId + '"]');
      if (card) { card.style.opacity = "0.5"; card.style.pointerEvents = "none"; }
      try {
        var adminId = getAdminId();
        var res = await fetch("/api/admin/action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ admin_id: adminId, inventory_id: inventoryId, action: action }),
        });
        var data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || "Error");
        showToast(action === "approve" ? "\u2705 NFT issued!" : "\u274C Request rejected", "success");
      } catch (err) {
        showToast("Error: " + err.message, "error");
        if (card) { card.style.opacity = "1"; card.style.pointerEvents = "auto"; }
      }
      setTimeout(refreshRequests, 500);
    }

    refreshRequests();
    setInterval(refreshRequests, 15000);
  </script>
</body>
</html>
